[project]
name = "pop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "httpx>=0.27",
  "anthropic>=0.40",
  "pandas>=2.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI memakai Query()/Path()/Body()/Depends() sebagai default argumen by
# design — ini bukan mutable default yang sebenarnya (B008), cuma pola
# dependency injection framework-nya. Koreksi 2026-08-24: komentar lama di
# sini bilang Depends() "sudah dikecualikan bawaan oleh ruff" — itu keliru,
# B008 terbukti tetap menyala di semua endpoint yang pakai
# `= Depends(get_session)` sebelum baris ini ditambah.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
# Tanpa ini, mypy menganggap Settings() (BaseSettings, field wajib dibaca
# dari env, bukan argumen konstruktor) kurang argumen — false positive.
# Ditemukan 2026-08-24 saat mengeraskan CI.
plugins = ["pydantic.mypy"]

# scikit-learn dan statsmodels tidak mengirim stub tipe maupun penanda py.typed,
# jadi mypy --strict menolak impornya. Yang dilonggarkan HANYA pengetahuan mypy
# soal isi paket pihak ketiga itu — kode kita sendiri tetap diperiksa penuh,
# termasuk anotasi di sekeliling pemanggilannya (services/topics.py,
# services/timeseries.py).
[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

# app/models BUKAN bagian dari cakupan strict CLAUDE.md §6 (yang wajib bersih
# hanya app/services dan app/ai, ditambah app/connectors sejak 2026-09-01).
# Ia punya pelanggaran `type-arg` dan `name-defined` pra-ada, sebagian di area
# pemetaan enum yang docs/roadmap.md tandai sensitif — membersihkannya adalah
# pekerjaan tersendiri dengan verifikasi database sendiri, bukan efek samping
# commit ini.
#
# `follow_imports = "silent"` membuat mypy TETAP membaca app/models untuk
# menentukan tipe yang diimpor app/connectors, tapi tidak melaporkan
# pelanggaran di dalamnya. Tanpa baris ini, menambahkan app/connectors ke
# perintah mypy memerahkan CI karena connectors mengimpor
# app.models.measurement — ketahuan saat menjalankan perintah CI-nya sendiri,
# bukan setelah push.
[[tool.mypy.overrides]]
module = ["app.models.*"]
follow_imports = "silent"

[project]
name = "pop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "httpx>=0.27",
  "anthropic>=0.40",
  "pandas>=2.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI memakai Query()/Path()/Body()/Depends() sebagai default argumen by
# design — ini bukan mutable default yang sebenarnya (B008), cuma pola
# dependency injection framework-nya. Koreksi 2026-08-24: komentar lama di
# sini bilang Depends() "sudah dikecualikan bawaan oleh ruff" — itu keliru,
# B008 terbukti tetap menyala di semua endpoint yang pakai
# `= Depends(get_session)` sebelum baris ini ditambah.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
# Tanpa ini, mypy menganggap Settings() (BaseSettings, field wajib dibaca
# dari env, bukan argumen konstruktor) kurang argumen — false positive.
# Ditemukan 2026-08-24 saat mengeraskan CI.
plugins = ["pydantic.mypy"]
